{% if widget.is_initial %}
    <p class="file-upload">
        Currently:
        <a href="{{ widget.value.url }}" target="_blank">
            {{ widget.value }}
        </a>

        {% if not widget.required %}
            <input type="checkbox"
                   name="{{ widget.checkbox_name }}"
                   id="{{ widget.checkbox_id }}"
                   style="display:none;">

            <button
                type="button"
                class="remove-current-file"
                style="
                    margin-left:8px;
                    border:none;
                    background:#dc3545;
                    color:white;
                    width:28px;
                    height:28px;
                    border-radius:50%;
                    font-size:18px;
                    font-weight:bold;
                    cursor:pointer;
                    line-height:28px;
                    padding:0;
                "
                title="Remove current file"
            >×</button>
        {% endif %}

        <br>
        Change:
    </p>
{% endif %}

<div style="display:flex; align-items:center; gap:8px;">
    <input
        type="{{ widget.type }}"
        name="{{ widget.name }}"
        {% include "django/forms/widgets/attrs.html" %}
    >

    <button
        type="button"
        class="remove-selected-file"
        style="
            display:none;
            border:none;
            background:#dc3545;
            color:white;
            width:28px;
            height:28px;
            border-radius:50%;
            font-size:18px;
            font-weight:bold;
            cursor:pointer;
            line-height:28px;
            padding:0;
        "
        title="Remove selected file"
    >×</button>
</div>
